<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Assi</title>
<style>
  :root {
    --bg:#0b0d10; --bg2:#0e1116; --panel:#141821; --line:#1b2028;
    --txt:#c9d3e3; --dim:#6b7488; --accent:#56d6ff; --me:#e6ecf7;
    --err:#ff7b7b; --ok:#7ee787;
    --mono: ui-monospace, "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { overscroll-behavior:none; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14.5px/1.55 var(--mono);
         display:flex; flex-direction:column; height:100dvh; }

  /* ----- шапка как в тг ----- */
  header { display:flex; align-items:center; gap:10px; padding:8px 12px;
           background:#0b0d10ee; backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
           padding-top:calc(8px + env(safe-area-inset-top)); }
  header img.ava { width:34px; height:34px; border-radius:50%; background:var(--panel); flex:none; }
  .who { display:flex; flex-direction:column; min-width:0; flex:1; }
  .nm { font-weight:600; font-size:15px; color:#eef2f8; letter-spacing:.2px; }
  .st { font-size:11.5px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .st.act { color:var(--accent); }
  button { background:transparent; color:var(--txt); border:0; width:38px; height:38px; flex:none;
           border-radius:10px; display:flex; align-items:center; justify-content:center;
           transition:transform .12s, background .2s, color .2s; }
  button:active { transform:scale(.9); background:#1a2029; }
  button svg { width:21px; height:21px; display:block; }
  #menu, #pw { color:var(--dim); }

  /* ----- лента в стиле терминала ----- */
  #log { flex:1; overflow-y:auto; padding:14px 14px 6px; scroll-behavior:smooth;
         -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; gap:14px; }
  .msg { white-space:pre-wrap; word-break:break-word; animation:fade .18s ease-out; }
  @keyframes fade { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
  .me { color:var(--me); border-left:2px solid #2a6df4; padding-left:10px; }
  .me::before { content:"❯ "; color:#2a6df4; }
  .ai { color:var(--txt); }
  .ai.pending { color:var(--dim); }
  .err { color:var(--err); font-size:13px; }
  code { font-family:var(--mono); background:#11151c; border:1px solid var(--line);
         padding:1px 5px; border-radius:4px; font-size:13px; color:#a9c7ff; }
  pre { background:var(--bg2); border:1px solid var(--line); border-radius:8px;
        padding:10px 12px; overflow-x:auto; margin:8px 0 0; }
  pre code { background:none; border:0; padding:0; color:#b9c6da; }
  .ai a, .me a { color:var(--accent); text-decoration:none; border-bottom:1px dashed #56d6ff55; }
  strong { color:#eef2f8; font-weight:600; }
  em { color:#9aa6bb; }
  .dots { display:inline-flex; gap:5px; align-items:center; height:16px; vertical-align:middle; }
  .dots i { width:5px; height:5px; border-radius:50%; background:var(--accent); opacity:.3;
            animation:blink 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay:.2s; }
  .dots i:nth-child(3) { animation-delay:.4s; }
  @keyframes blink { 0%,60%,100% { opacity:.25; } 30% { opacity:1; } }
  .caret::after { content:"▌"; color:var(--accent); animation:blink 1s steps(1) infinite; }

  /* ----- вложения ----- */
  .att { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .att img { max-width:190px; max-height:190px; border-radius:6px; display:block; border:1px solid var(--line); }
  .att a.file { display:flex; gap:7px; align-items:center; text-decoration:none; color:var(--txt);
                background:var(--bg2); border:1px solid var(--line); padding:6px 9px;
                border-radius:6px; font-size:12.5px; }
  .att a.file span.n { max-width:210px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ----- поле ввода ----- */
  footer { display:flex; gap:8px; align-items:flex-end; padding:8px 10px;
           padding-bottom:calc(8px + env(safe-area-inset-bottom));
           border-top:1px solid var(--line); background:#0b0d10; }
  textarea { flex:1; resize:none; background:var(--panel); color:var(--me); border:1px solid var(--line);
             border-radius:8px; padding:10px 12px; font:inherit; max-height:140px; min-height:42px; }
  textarea:focus { outline:none; border-color:#2a6df4; }
  textarea::placeholder { color:#5a6376; }
  footer button { background:var(--panel); border:1px solid var(--line); border-radius:8px; }
  button.send { background:#1d4ed8; border-color:#1d4ed8; color:#fff; }
  button.send:disabled { opacity:.4; }
  button.rec { background:#c0392b; border-color:#c0392b; color:#fff; animation:pulse 1.1s infinite; }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 #c0392b88; } 50% { box-shadow:0 0 0 7px #c0392b00; } }
  .chips { display:flex; gap:6px; flex-wrap:wrap; padding:6px 12px 0; }
  .chip { background:var(--bg2); border:1px solid var(--line); color:var(--dim);
          font-size:12px; padding:3px 8px; border-radius:5px; }
  .chip b { color:var(--accent); font-weight:400; }

  /* ----- служебное ----- */
  #jump { position:fixed; right:12px; bottom:78px; width:36px; height:36px; border-radius:50%;
          background:#1a2029; border:1px solid var(--line); color:var(--dim); opacity:0;
          pointer-events:none; transition:opacity .25s, transform .25s; }
  #jump.on { opacity:1; pointer-events:auto; }
  #setup { padding:16px; display:none; }
  #setup input { width:100%; padding:12px; border-radius:8px; border:1px solid var(--line);
                 background:var(--panel); color:var(--txt); font:inherit; }
  #setup p { color:var(--dim); font-size:12.5px; }

  /* ----- меню питания ----- */
  #sheet { position:fixed; inset:0; display:none; flex-direction:column; justify-content:flex-end;
           background:#000a; backdrop-filter:blur(2px); z-index:40; }
  #sheet.on { display:flex; }
  #sheet .row { background:var(--panel); border-top:1px solid var(--line); padding:16px 20px;
                font-size:14.5px; animation:fade .16s ease-out; }
  #sheet .row:last-child { padding-bottom:26px; }
  #sheet .row.danger { color:var(--err); }
  #sheet .row:active { background:#1a2029; }

  /* ----- список чатов ----- */
  #drawer { position:fixed; inset:0 auto 0 0; width:min(84vw,340px); background:#0d1116;
            border-right:1px solid var(--line); transform:translateX(-102%);
            transition:transform .26s cubic-bezier(.2,.8,.3,1); z-index:50;
            display:flex; flex-direction:column; box-shadow:8px 0 24px #0006; }
  #drawer.on { transform:none; }
  #veil { position:fixed; inset:0; background:#0008; opacity:0; pointer-events:none;
          transition:opacity .26s; z-index:45; }
  #veil.on { opacity:1; pointer-events:auto; }
  .dhead { padding:calc(12px + env(safe-area-inset-top)) 14px 10px; border-bottom:1px solid var(--line);
           font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; }
  #newchat { margin:12px 14px; width:auto; height:42px; gap:8px; background:var(--panel);
             border:1px solid var(--line); border-radius:8px; font:inherit; font-size:13.5px;
             color:var(--accent); }
  #newchat svg { width:16px; height:16px; }
  #list { flex:1; overflow-y:auto; padding:0 8px 20px; display:flex; flex-direction:column; gap:2px; }
  .sess { padding:10px 10px; border-radius:6px; display:flex; flex-direction:column; gap:2px; }
  .sess .t { color:var(--txt); font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sess .m { color:var(--dim); font-size:11px; }
  .sess:active { background:#161b23; }
  .sess.cur { background:#131a24; box-shadow:inset 2px 0 0 var(--accent); }
  .sess.cur .t { color:var(--accent); }
</style>
</head>
<body>
<header>
  <button id="menu" title="чаты" aria-label="чаты">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
      <path d="M4 7h16M4 12h16M4 17h10"/>
    </svg>
  </button>
  <img class="ava" src="/icon-192.png?v=4" alt="">
  <div class="who">
    <div class="nm">Assi</div>
    <div class="st" id="stat">ждёт</div>
  </div>
  <button id="pw" title="питание" aria-label="питание">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3v9"/><path d="M6.4 6.4a8 8 0 1011.2 0"/>
    </svg>
  </button>
</header>

<div id="veil"></div>
<aside id="drawer">
  <div class="dhead">Чаты</div>
  <button id="newchat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M12 5v14M5 12h14"/>
    </svg>
    новый чат
  </button>
  <div id="list"></div>
</aside>

<div id="sheet">
  <div class="row" data-act="wake">Разбудить (WOL)</div>
  <div class="row" data-act="sleep">Сон</div>
  <div class="row" data-act="lock">Заблокировать</div>
  <div class="row" data-act="reboot">Перезагрузить</div>
  <div class="row danger" data-act="shutdown">Выключить</div>
</div>

<div id="setup">
  <p>Вставь токен моста:</p>
  <input id="tok" placeholder="токен" autocomplete="off">
  <p id="tokmsg"></p>
  <p>Он печатается при запуске моста и лежит в bridge.json.</p>
</div>

<div id="log"></div>
<div class="chips" id="chips"></div>
<footer>
  <button id="attach" title="файл" aria-label="прикрепить файл">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21.4 11.05l-8.6 8.6a5.5 5.5 0 01-7.78-7.78l8.6-8.6a3.7 3.7 0 015.23 5.23l-8.6 8.6a1.85 1.85 0 01-2.62-2.62l7.9-7.9"/>
    </svg>
  </button>
  <button id="mic" title="голос" aria-label="записать голос">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="3" width="6" height="11" rx="3"/>
      <path d="M5 11a7 7 0 0014 0M12 18v3M9 21h6"/>
    </svg>
  </button>
  <textarea id="text" rows="1" placeholder="написать…"></textarea>
  <button id="send" class="send" title="отправить" aria-label="отправить">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 19V5M6 11l6-6 6 6"/>
    </svg>
  </button>
</footer>
<button id="jump" title="вниз" aria-label="вниз">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
</button>
<input id="file" type="file" multiple hidden>

<script>
const $ = id => document.getElementById(id);
let token = localStorage.getItem('token') || new URLSearchParams(location.search).get('token') || '';
if (new URLSearchParams(location.search).get('token')) localStorage.setItem('token', token);
let pendingFiles = [];
let nodes = [];
let busy = false;
let curSid = null, streamSid = null;

/* статус в шапке: "ждёт" / "думает…" / "печатает…" / "смотрит файл…" / "распознаёт…" */
function setStat(text, active) {
  const el = $('stat');
  el.textContent = text || 'ждёт';
  el.classList.toggle('act', !!active);
}

function showSetup(on) {
  $('setup').style.display = on ? 'block' : 'none';
  document.querySelector('footer').style.display = on ? 'none' : 'flex';
}
if (!token) showSetup(true);

/* Ввод токена: проверяем сразу, показываем причину, и стартуем чат без перезагрузки страницы */
async function startWithToken(value) {
  token = (value || '').trim();
  localStorage.setItem('token', token);
  const msg = $('tokmsg');
  if (!token) { if (msg) msg.textContent = ''; showSetup(true); return; }
  if (msg) msg.textContent = 'проверяю…';
  try {
    const r = await fetch('/api/history', { headers: { 'X-Bridge-Token': token } });
    if (r.status === 401) {
      localStorage.removeItem('token');
      token = '';
      if (msg) msg.textContent = 'токен не подошёл — скопируй целиком и вставь заново';
      showSetup(true);
      return;
    }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    if (msg) msg.textContent = '';
    _netState = true;
    showSetup(false);
    nodes = [];
    $('log').innerHTML = '';
    refresh(); loadSessions(); openStream();
  } catch (e) {
    if (msg) msg.textContent = 'не удалось проверить: ' + (e.message || e);
  }
}
$('tok').addEventListener('change', e => startWithToken(e.target.value));
$('tok').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); startWithToken(e.target.value); } });

async function api(path, opts = {}) {
  let lastErr;
  for (let attempt = 0; attempt < 4; attempt++) {
    try {
      const ctl = new AbortController();
      const t = setTimeout(() => ctl.abort(), 15000);
      const r = await fetch(path, { ...opts, signal: ctl.signal, headers: { 'X-Bridge-Token': token, ...(opts.headers || {}) } });
      clearTimeout(t);
      if (r.status === 401) { localStorage.removeItem('token'); showSetup(true); throw new Error('токен'); }
      if (!r.ok) throw new Error((await r.text()).slice(0, 300));
      netOk();
      return r.json();
    } catch (e) {
      if (e.message === 'токен') throw e;
      lastErr = e;
      if (attempt < 3) await new Promise(res => setTimeout(res, 1000 * (attempt + 1) * 2));
    }
  }
  netDown();
  throw lastErr;
}
let _netState = true;
function netDown() { if (_netState) { _netState = false; setStat('нет связи, пробую ещё', false); } }
function netOk() { if (!_netState) { _netState = true; logc('связь восстановлена'); } }

/* ---------- минимальный markdown ---------- */
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function md(src) {
  const parts = [];
  let text = src.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    parts.push('<pre><code>' + esc(code.replace(/\n$/, '')) + '</code></pre>');
    return '\u0000' + (parts.length - 1) + '\u0000';
  });
  text = esc(text)
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  text = text.replace(/\u0000(\d+)\u0000/g, (_, i) => parts[+i]);
  return text;
}

const IMG = /\.(png|jpe?g|webp|gif|heic)$/i;

function fileEl(path) {
  const name = path.split(/[\\/]/).pop();
  const url = '/api/file?t=' + encodeURIComponent(token) + '&path=' + encodeURIComponent(path);
  if (IMG.test(name)) {
    const a = document.createElement('a');
    a.href = url; a.target = '_blank'; a.rel = 'noopener';
    const img = document.createElement('img');
    img.src = url; img.alt = name; img.loading = 'lazy';
    a.appendChild(img);
    return a;
  }
  const a = document.createElement('a');
  a.className = 'file'; a.href = url; a.target = '_blank'; a.rel = 'noopener';
  a.innerHTML = '<span>▤</span><span class="n"></span>';
  a.querySelector('.n').textContent = name;
  return a;
}

/* ---------- отрисовка ---------- */
const log = $('log');
const nearBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 90;

function scrollDown(instant) {
  if (instant) log.scrollTop = log.scrollHeight;
  else log.scrollTo({ top: log.scrollHeight, behavior: 'smooth' });
}

function makeNode(m) {
  const d = document.createElement('div');
  d.className = 'msg ' + (m.role === 'user' ? 'me' : m.error ? 'err' : 'ai');
  d._text = document.createElement('div');
  d.appendChild(d._text);
  d._sig = '';
  return d;
}

function paintNode(d, m) {
  if (m.role === 'user') {
    const sig = 'u' + m.text + '|' + (m.files || []).join(',');
    if (d._sig === sig) return false;
    d._sig = sig;
    d._text.innerHTML = md(m.text || '');
    d.querySelectorAll('.att').forEach(n => n.remove());
    if (m.files && m.files.length) {
      const box = document.createElement('div');
      box.className = 'att';
      m.files.forEach(f => box.appendChild(fileEl(f)));
      d.appendChild(box);
    }
    return true;
  }
  if (m.error) {
    const sig = 'e' + m.error;
    if (d._sig === sig) return false;
    d._sig = sig;
    d._text.textContent = '⚠ ' + m.error;
    return true;
  }
  const sig = 'a' + (m.text || '') + '|' + (m.done ? 1 : 0);
  if (d._sig === sig) return false;
  d._sig = sig;
  if (!m.text) {
    d._text.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  } else if (m.done) {
    d._text.innerHTML = md(m.text);
    d._text.classList.remove('caret');
  } else {
    d._text.innerHTML = md(m.text);
    d._text.classList.add('caret');
  }
  d.classList.toggle('pending', !m.done);
  return true;
}

function render(messages) {
  const stick = nearBottom();
  if (messages.length < nodes.length) {
    log.innerHTML = ''; nodes = [];
  }
  let changed = false;
  messages.forEach((m, i) => {
    if (!nodes[i]) { nodes[i] = makeNode(m); log.appendChild(nodes[i]); changed = true; }
    if (paintNode(nodes[i], m)) changed = true;
  });
  while (nodes.length > messages.length) { nodes.pop().remove(); changed = true; }
  if (stick && changed) scrollDown(false);
}

function notify() {
  if (navigator.vibrate) navigator.vibrate(35);
  if (document.hidden && window.Notification && Notification.permission === 'granted') {
    new Notification('Assi', { body: 'ответила', icon: '/icon-192.png?v=4' });
  }
}

/* ---------- обмен ---------- */
let spinning = false;
async function refresh() {
  if (spinning) return;
  spinning = true;
  try {
    const h = await api('/api/history');
    const msgs = h.messages;
    if (h.session !== curSid) { curSid = h.session; paintSessions(); }
    reconcile(msgs);
    if (!streaming) render(msgs);
    if (!busy && !streaming) setStat('ждёт', false);
  } catch (e) {
    // статус уже поставлен netDown() внутри api(); повторная попытка — на следующем тике
  }
  spinning = false;
}

function reconcile(msgs) {
  if (!busy && !streaming) return;
  const lastUser = msgs.map(m => m.role).lastIndexOf('user');
  const tail = lastUser < 0 ? msgs : msgs.slice(lastUser + 1);
  const done = tail.find(m => m.role === 'assistant' && m.done);
  if (!done) return;
  if (streaming) {
    paintNode(streaming.node, { role: 'assistant', text: done.text || streaming.text, done: true });
    streaming = null;
  }
  busy = false;
  setStat('ждёт', false);
  notify();
}

async function send() {
  const text = $('text').value.trim();
  if ((!text && !pendingFiles.length) || busy) return;
  const files = pendingFiles.slice();
  pendingFiles = []; renderChips();
  $('text').value = ''; $('text').style.height = '42px';
  busy = true;
  setStat('думает…', true);
  const guess = { role: 'user', text, files: files.map(f => f.path) };
  nodes.push(makeNode(guess)); log.appendChild(nodes[nodes.length - 1]);
  paintNode(nodes[nodes.length - 1], guess);
  const draft = makeNode({ role: 'assistant', text: '', done: false });
  paintNode(draft, { role: 'assistant', text: '', done: false });
  nodes.push(draft); log.appendChild(draft);
  streaming = { node: draft, text: '', msg: null };
  streamSid = curSid;
  scrollDown(true);
  if (navigator.vibrate) navigator.vibrate(15);
  try {
    await api('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                             body: JSON.stringify({ text, files: files.map(f => f.path) }) });
  } catch (e) {
    const err = makeNode({ role: 'assistant', error: e.message });
    paintNode(err, { role: 'assistant', error: e.message });
    nodes.push(err); log.appendChild(err);
    streaming = null; busy = false; setStat('ошибка', false);
  }
}

/* ---------- поток ответа (SSE) ---------- */
let streaming = null, esrc = null, lastEvt = Date.now();

function openStream() {
  if (esrc || !token) return;
  try { esrc = new EventSource('/api/stream?t=' + encodeURIComponent(token)); }
  catch (_) { esrc = null; return; }
  esrc.onmessage = ev => {
    lastEvt = Date.now();
    let e;
    try { e = JSON.parse(ev.data); } catch (_) { return; }
    const d = e.data || {};
    if (e.type === 'session.text.started') {
      setStat('печатает…', true);
      if (!streaming) {
        const n = makeNode({ role: 'assistant', text: '', done: false });
        paintNode(n, { role: 'assistant', text: '', done: false });
        nodes.push(n); log.appendChild(n);
        streaming = { node: n, text: '', msg: null };
      }
      streaming.msg = d.assistantMessageID || null;
      if (nearBottom()) scrollDown(false);
      return;
    }
    if (e.type === 'session.text.delta') {
      setStat('печатает…', true);
      if (!streaming) {
        const n = makeNode({ role: 'assistant', text: '', done: false });
        nodes.push(n); log.appendChild(n);
        streaming = { node: n, text: '', msg: d.assistantMessageID || null };
      }
      streaming.text += d.delta || '';
      paintNode(streaming.node, { role: 'assistant', text: streaming.text, done: false });
      streaming.node._sig = 'x';
      if (nearBottom()) scrollDown(false);
      return;
    }
    if (e.type === 'session.execution.succeeded' || e.type === 'session.execution.failed'
        || e.type === 'session.execution.interrupted') {
      const failed = e.type !== 'session.execution.succeeded';
      if (streaming) {
        paintNode(streaming.node, { role: 'assistant', text: streaming.text || (failed ? '(пусто)' : ''), done: true });
        streaming = null;
      }
      busy = false;
      setStat(failed ? 'ошибка' : 'ждёт', false);
      notify();
      refresh();
      return;
    }
    if (e.type === 'bridge.error') {
      busy = false;
      setStat('поток недоступен', false);
    }
  };
  esrc.onerror = () => { /* EventSource сам переподключается */ };
}

function closeStream() { if (esrc) { esrc.close(); esrc = null; } }

function renderChips() {
  $('chips').innerHTML = pendingFiles.map(f => `<span class="chip"><b>▤</b> ${esc(f.name)}</span>`).join('');
}

/* ---------- список чатов ---------- */
let sessions = [];

function fmtTime(ms) {
  if (!ms) return '';
  const d = new Date(ms), now = new Date();
  const hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  if (d.toDateString() === now.toDateString()) return hm;
  const dm = String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0');
  return dm + ' ' + hm;
}

function paintSessions() {
  const box = $('list');
  if (!sessions.length) { box.innerHTML = '<div class="sess"><div class="m">пока пусто</div></div>'; return; }
  box.innerHTML = '';
  sessions.forEach(s => {
    const d = document.createElement('div');
    d.className = 'sess' + (s.id === curSid ? ' cur' : '');
    const t = document.createElement('div'); t.className = 't'; t.textContent = s.title;
    const m = document.createElement('div'); m.className = 'm';
    m.textContent = fmtTime(s.updated) + (s.agent ? ' · ' + s.agent : '');
    d.append(t, m);
    d.onclick = () => selectSession(s.id);
    box.appendChild(d);
  });
}

async function loadSessions() {
  try {
    const r = await api('/api/sessions');
    sessions = r.sessions || [];
    if (r.current) curSid = r.current;
    paintSessions();
  } catch (_) {}
}

function openDrawer(on) {
  $('drawer').classList.toggle('on', on);
  $('veil').classList.toggle('on', on);
  if (on) loadSessions();
}

async function selectSession(id) {
  if (id === curSid) { openDrawer(false); return; }
  try {
    await api('/api/session/select', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                       body: JSON.stringify({ id }) });
    curSid = id;
    log.innerHTML = ''; nodes = []; streaming = null; busy = false;
    closeStream(); openStream();
    await refresh();
    openDrawer(false);
    paintSessions();
  } catch (e) { setStat('не переключилось', false); }
}

$('menu').onclick = () => openDrawer(true);
$('veil').onclick = () => openDrawer(false);
$('newchat').onclick = async () => {
  try {
    const r = await api('/api/session/new', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    curSid = r.session;
    log.innerHTML = ''; nodes = []; streaming = null; busy = false;
    closeStream(); openStream();
    setStat('ждёт', false);
    openDrawer(false);
    await loadSessions();
  } catch (e) { setStat('не создался', false); }
};

/* ---------- обработчики ---------- */
$('send').onclick = send;
$('text').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$('text').addEventListener('input', e => {
  e.target.style.height = '42px';
  e.target.style.height = Math.min(e.target.scrollHeight, 140) + 'px';
});

log.addEventListener('scroll', () => {
  $('jump').classList.toggle('on', !nearBottom());
});
$('jump').onclick = () => scrollDown(true);

$('attach').onclick = () => $('file').click();
$('file').onchange = async e => {
  setStat('смотрит файл…', true);
  for (const f of e.target.files) {
    const fd = new FormData(); fd.append('file', f);
    try {
      const r = await api('/api/upload', { method: 'POST', body: fd });
      pendingFiles.push(r); renderChips();
    } catch (err) { setStat('файл не загрузился', false); }
  }
  setStat('ждёт', false);
  e.target.value = '';
};

/* ---------- питание ---------- */
const NAMES = { wake: 'Разбудить ноут (WOL)?', lock: 'Заблокировать ноут?', sleep: 'Усыпить ноут?', reboot: 'Перезагрузить ноут?', shutdown: 'Выключить ноут?' };
$('pw').onclick = () => { if (!token) return; $('sheet').classList.add('on'); };
$('sheet').onclick = async (e) => {
  if (e.target === $('sheet')) { $('sheet').classList.remove('on'); return; }
  const act = e.target.dataset.act;
  if (!act) return;
  $('sheet').classList.remove('on');
  if (!confirm(NAMES[act])) return;
  try {
    await api('/api/power', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: act }) });
    setStat(act === 'lock' ? 'заблокировано' : 'команда ушла', false);
    if (navigator.vibrate) navigator.vibrate(30);
  } catch (_) { setStat('не получилось', false); }
};

/* ---------- микрофон ---------- */
let rec = null, chunks = [], recStart = 0;
const MIC_SVG = $('mic').innerHTML;
const STOP_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>';

function logc(msg) {
  try {
    fetch('/api/clientlog', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Bridge-Token': token },
                              body: JSON.stringify({ msg }) }).catch(() => {});
  } catch (_) {}
}
window.addEventListener('error', e => logc('JS error: ' + e.message + ' @' + e.filename + ':' + e.lineno));
window.addEventListener('unhandledrejection', e => logc('JS reject: ' + (e.reason && (e.reason.stack || e.reason.message || e.reason))));

const micOk = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
logc('загрузка: secure=' + window.isSecureContext + ' mediaDevices=' + !!navigator.mediaDevices +
     ' micOk=' + micOk + ' MediaRecorder=' + (typeof MediaRecorder) +
     ' href=' + location.href + ' sw=' + (navigator.serviceWorker && navigator.serviceWorker.controller ? 'yes' : 'no') +
     ' ua=' + navigator.userAgent.slice(0, 60));
if (!micOk) { $('mic').style.opacity = '0.45'; $('mic').title = 'нужен https'; }

/* Микрофон открывается только по нажатию и освобождается сразу после записи:
   иначе система считает, что идёт звонок, и портит вывод звука (музыка в наушниках падает в моно/тише). */
$('mic').onclick = async () => {
  if (!micOk) { setStat('микрофон только на https', false); return; }
  if (rec && rec.state === 'recording') { rec.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 }
    });
    const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
    rec = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 64000 } : undefined);
    chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = async () => {
      const secs = ((Date.now() - recStart) / 1000).toFixed(1);
      $('mic').classList.remove('rec'); $('mic').innerHTML = MIC_SVG;
      const type = (rec && rec.mimeType) || mime || 'audio/webm';
      const blob = new Blob(chunks, { type });
      stream.getTracks().forEach(t => t.stop());   // сразу отпускаем микрофон
      rec = null;
      logc('mic: запись ' + secs + 's, ' + blob.size + ' байт, mime=' + type);
      setStat('распознаёт…', true);
      const fd = new FormData();
      fd.append('file', blob, 'voice.webm');
      fd.append('seconds', secs);
      try {
        const r = await api('/api/transcribe', { method: 'POST', body: fd });
        $('text').value = ($('text').value + ' ' + r.text).trim();
        $('text').focus(); $('text').dispatchEvent(new Event('input'));
        setStat('ждёт', false);
      } catch (e) { setStat('не распозналось', false); }
    };
    rec.start(250); // чанки по 250 мс, чтобы начало записи не терялось
    recStart = Date.now();
    $('mic').classList.add('rec'); $('mic').innerHTML = STOP_SVG;
    setStat('пишу…', true);
    if (navigator.vibrate) navigator.vibrate(20);
  } catch (e) {
    setStat('микрофон: ' + (e.name || ''), false);
  }
};
window.addEventListener('pagehide', () => {
  if (rec && rec.state === 'recording') { try { rec.stop(); } catch (_) {} }
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
if (window.Notification && Notification.permission === 'default') {
  setTimeout(() => Notification.requestPermission().catch(() => {}), 4000);
}
if (token) { refresh(); openStream(); loadSessions(); }
setInterval(() => { if (token) refresh(); }, 2000);
setInterval(() => { if (token && !document.hidden) loadSessions(); }, 15000);
setInterval(() => {
  if (!token || !streaming) { lastEvt = Date.now(); return; }
  if (Date.now() - lastEvt > 25000) { lastEvt = Date.now(); closeStream(); openStream(); refresh(); }
}, 5000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) closeStream();
  else if (token) { openStream(); refresh(); }
});
</script>
</body>
