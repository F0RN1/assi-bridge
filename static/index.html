<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Асси</title>
<style>
  :root { --bg:#111318; --panel:#1a1d24; --me:#2a6df4; --txt:#e8eaf0; --dim:#8a90a0; --line:#23262f; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { overscroll-behavior:none; }
  body { margin:0; background:var(--bg); color:var(--txt); font:16px/1.45 system-ui,sans-serif;
         display:flex; flex-direction:column; height:100dvh; }
  header { padding:10px 14px; font-weight:600; border-bottom:1px solid var(--line); display:flex; gap:10px;
           align-items:center; backdrop-filter:blur(8px); background:#111318dd; }
  header img { width:26px; height:26px; border-radius:8px; }
  header small { color:var(--dim); font-weight:400; margin-left:auto; font-size:12px;
                 transition:opacity .3s; }
  #log { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px;
         scroll-behavior:smooth; -webkit-overflow-scrolling:touch; }
  .msg { max-width:88%; padding:9px 12px; border-radius:14px; white-space:pre-wrap; word-break:break-word;
         animation:pop .22s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes pop { from { opacity:0; transform:translateY(6px) scale(.97); } to { opacity:1; transform:none; } }
  .me { align-self:flex-end; background:var(--me); border-bottom-right-radius:5px; }
  .ai { align-self:flex-start; background:var(--panel); border-bottom-left-radius:5px; }
  .ai.pending { color:#c9cede; }
  .err { align-self:center; color:#ff7b7b; font-size:13px; }
  .ai code, .ai pre { font-family:ui-monospace,Consolas,monospace; font-size:13.5px; }
  .ai code { background:#00000045; padding:1px 5px; border-radius:5px; }
  .ai pre { background:#0d0f14; padding:10px; border-radius:10px; overflow-x:auto; margin:8px 0 0; }
  .ai pre code { background:none; padding:0; }
  .ai a { color:#8ab4ff; }
  .dots { display:inline-flex; gap:4px; align-items:center; height:20px; }
  .dots i { width:6px; height:6px; border-radius:50%; background:var(--dim); animation:blink 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay:.2s; }
  .dots i:nth-child(3) { animation-delay:.4s; }
  @keyframes blink { 0%,60%,100% { opacity:.25; transform:translateY(0); } 30% { opacity:1; transform:translateY(-3px); } }
  footer { padding:8px; border-top:1px solid var(--line); background:var(--bg); display:flex; gap:8px;
           align-items:flex-end; padding-bottom:calc(8px + env(safe-area-inset-bottom)); }
  textarea { flex:1; resize:none; background:var(--panel); color:var(--txt); border:0; border-radius:12px;
             padding:10px 12px; font:inherit; max-height:130px; min-height:44px; transition:background .2s; }
  textarea:focus { outline:none; background:#20242d; }
  button { background:var(--panel); color:var(--txt); border:0; border-radius:12px; width:44px; height:44px;
           font-size:19px; flex:none; display:flex; align-items:center; justify-content:center;
           transition:transform .12s, background .2s; }
  button:active { transform:scale(.9); }
  button svg { width:23px; height:23px; display:block; }
  button.send { background:var(--me); }
  button.send:disabled { opacity:.45; }
  button.rec { background:#c0392b; animation:pulse 1.1s infinite; }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 #c0392b80; } 50% { box-shadow:0 0 0 8px #c0392b00; } }
  .chips { display:flex; gap:6px; flex-wrap:wrap; padding:0 10px; }
  .chip { background:var(--panel); color:var(--dim); font-size:12px; padding:4px 8px; border-radius:8px;
          animation:pop .2s; }
  .att { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .att img { max-width:180px; max-height:180px; border-radius:10px; display:block; }
  .att a.file { display:flex; gap:6px; align-items:center; text-decoration:none; color:inherit;
                background:#00000038; padding:6px 9px; border-radius:9px; font-size:13px; }
  .att a.file span.n { max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #setup { padding:14px; display:none; }
  #setup input { width:100%; padding:12px; border-radius:12px; border:0; background:var(--panel); color:var(--txt); font:inherit; }
  #jump { position:fixed; right:14px; bottom:82px; width:38px; height:38px; border-radius:50%;
          background:#2a2f3aee; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; }
  #jump.on { opacity:1; pointer-events:auto; }
</style>
</head>
<body>
<header><img src="/icon-192.png" alt="">Асси <small id="stat">мост</small></header>
<div id="setup">
  <p>Вставь токен моста:</p>
  <input id="tok" placeholder="токен" autocomplete="off">
  <p style="color:#8a90a0;font-size:13px">Он печатается в консоли bridge при запуске и хранится в bridge.json.</p>
</div>
<div id="log"></div>
<div class="chips" id="chips"></div>
<footer>
  <button id="attach" title="файл" aria-label="прикрепить файл">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21.4 11.05l-8.6 8.6a5.5 5.5 0 01-7.78-7.78l8.6-8.6a3.7 3.7 0 015.23 5.23l-8.6 8.6a1.85 1.85 0 01-2.62-2.62l7.9-7.9"/>
    </svg>
  </button>
  <button id="mic" title="голос" aria-label="записать голос">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="3" width="6" height="11" rx="3"/>
      <path d="M5 11a7 7 0 0014 0M12 18v3M9 21h6"/>
    </svg>
  </button>
  <textarea id="text" rows="1" placeholder="Написать…"></textarea>
  <button id="send" class="send" title="отправить" aria-label="отправить">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 19V5M6 11l6-6 6 6"/>
    </svg>
  </button>
</footer>
<button id="jump" title="вниз" aria-label="вниз">
  <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
</button>
<input id="file" type="file" multiple hidden>

<script>
const $ = id => document.getElementById(id);
let token = localStorage.getItem('token') || new URLSearchParams(location.search).get('token') || '';
if (new URLSearchParams(location.search).get('token')) localStorage.setItem('token', token);
let pendingFiles = [];
let nodes = [];       // DOM-узлы, параллельные messages
let lastData = null;  // последний ответ /api/history
let busy = false;

function showSetup(on) {
  $('setup').style.display = on ? 'block' : 'none';
  document.querySelector('footer').style.display = on ? 'none' : 'flex';
}
if (!token) showSetup(true);
$('tok').addEventListener('change', e => {
  token = e.target.value.trim(); localStorage.setItem('token', token); showSetup(!token);
});

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'X-Bridge-Token': token, ...(opts.headers || {}) } });
  if (r.status === 401) { localStorage.removeItem('token'); showSetup(true); throw new Error('токен'); }
  if (!r.ok) throw new Error((await r.text()).slice(0, 300));
  return r.json();
}

/* ---------- минимальный markdown ---------- */
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function md(src) {
  const parts = [];
  let text = src.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    parts.push('<pre><code>' + esc(code.replace(/\n$/, '')) + '</code></pre>');
    return '\u0000' + (parts.length - 1) + '\u0000';
  });
  text = esc(text)
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  text = text.replace(/\u0000(\d+)\u0000/g, (_, i) => parts[+i]);
  return text;
}

const IMG = /\.(png|jpe?g|webp|gif|heic)$/i;

function fileEl(path) {
  const name = path.split(/[\\/]/).pop();
  const url = '/api/file?t=' + encodeURIComponent(token) + '&path=' + encodeURIComponent(path);
  if (IMG.test(name)) {
    const a = document.createElement('a');
    a.href = url; a.target = '_blank'; a.rel = 'noopener';
    const img = document.createElement('img');
    img.src = url; img.alt = name; img.loading = 'lazy';
    a.appendChild(img);
    return a;
  }
  const a = document.createElement('a');
  a.className = 'file'; a.href = url; a.target = '_blank'; a.rel = 'noopener';
  a.innerHTML = `<span>📄</span><span class="n"></span>`;
  a.querySelector('.n').textContent = name;
  return a;
}

/* ---------- отрисовка ---------- */
const log = $('log');
const nearBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 90;

function scrollDown(instant) {
  if (instant) log.scrollTop = log.scrollHeight;
  else log.scrollTo({ top: log.scrollHeight, behavior: 'smooth' });
}

function makeNode(m) {
  const d = document.createElement('div');
  d.className = 'msg ' + (m.role === 'user' ? 'me' : m.error ? 'err' : 'ai');
  d._text = document.createElement('div');
  d.appendChild(d._text);
  d._sig = '';
  return d;
}

function paintNode(d, m) {
  if (m.role === 'user') {
    const sig = 'u' + m.text + '|' + (m.files || []).join(',');
    if (d._sig === sig) return false;
    d._sig = sig;
    d._text.innerHTML = md(m.text || '');
    d.querySelectorAll('.att').forEach(n => n.remove());
    if (m.files && m.files.length) {
      const box = document.createElement('div');
      box.className = 'att';
      m.files.forEach(f => box.appendChild(fileEl(f)));
      d.appendChild(box);
    }
    return true;
  }
  if (m.error) {
    const sig = 'e' + m.error;
    if (d._sig === sig) return false;
    d._sig = sig;
    d._text.textContent = '⚠ ' + m.error;
    return true;
  }
  const sig = 'a' + (m.text || '') + '|' + (m.done ? 1 : 0);
  if (d._sig === sig) return false;
  d._sig = sig;
  if (!m.text) {
    d._text.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  } else {
    d._text.innerHTML = md(m.text);
  }
  d.classList.toggle('pending', !m.done);
  return true;
}

function render(messages) {
  const stick = nearBottom();
  if (messages.length < nodes.length) {
    log.innerHTML = ''; nodes = [];
  }
  let changed = false;
  messages.forEach((m, i) => {
    if (!nodes[i]) { nodes[i] = makeNode(m); log.appendChild(nodes[i]); changed = true; }
    if (paintNode(nodes[i], m)) changed = true;
  });
  if (stick && changed) scrollDown(false);
}

function notify() {
  if (navigator.vibrate) navigator.vibrate(35);
  if (document.hidden && window.Notification && Notification.permission === 'granted') {
    new Notification('Асси', { body: 'ответила', icon: '/icon-192.png' });
  }
}

/* ---------- обмен ---------- */
let spinning = false;
async function refresh() {
  if (spinning) return;
  spinning = true;
  try {
    const h = await api('/api/history');
    const msgs = h.messages;
    reconcile(msgs);
    if (!streaming) render(msgs);
    lastData = msgs;
    if (!busy) $('stat').textContent = msgs.length + ' сообщ.';
  } catch (e) {
    $('stat').textContent = 'нет связи';
  }
  spinning = false;
}

// Сверяет локальное состояние с историей: если ответ уже готов, а поток потерялся — размораживаем UI.
function reconcile(msgs) {
  if (!busy && !streaming) return;
  const lastUser = msgs.map(m => m.role).lastIndexOf('user');
  const tail = lastUser < 0 ? msgs : msgs.slice(lastUser + 1);
  const done = tail.find(m => m.role === 'assistant' && m.done);
  if (!done) return;
  if (streaming) {
    const text = done.text || streaming.text;
    paintNode(streaming.node, { role: 'assistant', text, done: true });
    streaming = null;
  }
  busy = false;
  $('stat').textContent = '';
  notify();
}

async function send() {
  const text = $('text').value.trim();
  if ((!text && !pendingFiles.length) || busy) return;
  const files = pendingFiles.slice();
  pendingFiles = []; renderChips();
  $('text').value = ''; $('text').style.height = '44px';
  busy = true;
  $('stat').textContent = 'думаю…';
  const guess = { role: 'user', text, files: files.map(f => f.path) };
  nodes.push(makeNode(guess)); log.appendChild(nodes[nodes.length - 1]);
  paintNode(nodes[nodes.length - 1], guess);
  const draft = makeNode({ role: 'assistant', text: '', done: false });
  paintNode(draft, { role: 'assistant', text: '', done: false });
  nodes.push(draft); log.appendChild(draft);
  streaming = { node: draft, text: '', msg: null };
  scrollDown(true);
  if (navigator.vibrate) navigator.vibrate(15);
  try {
    await api('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                             body: JSON.stringify({ text, files: files.map(f => f.path) }) });
  } catch (e) {
    const err = makeNode({ role: 'assistant', error: e.message });
    paintNode(err, { role: 'assistant', error: e.message });
    nodes.push(err); log.appendChild(err);
    streaming = null; busy = false; $('stat').textContent = 'ошибка';
  }
}

/* ---------- поток ответа (SSE) ---------- */
let streaming = null, esrc = null, lastEvt = Date.now();

function openStream() {
  if (esrc || !token) return;
  try { esrc = new EventSource('/api/stream?t=' + encodeURIComponent(token)); }
  catch (_) { esrc = null; return; }
  esrc.onmessage = ev => {
    lastEvt = Date.now();
    let e;
    try { e = JSON.parse(ev.data); } catch (_) { return; }
    const d = e.data || {};
    if (e.type === 'session.text.started') {
      if (!streaming) {
        const n = makeNode({ role: 'assistant', text: '', done: false });
        paintNode(n, { role: 'assistant', text: '', done: false });
        nodes.push(n); log.appendChild(n);
        streaming = { node: n, text: '', msg: null };
      }
      streaming.msg = d.assistantMessageID || null;
      if (nearBottom()) scrollDown(false);
      return;
    }
    if (e.type === 'session.text.delta') {
      if (!streaming) {
        const n = makeNode({ role: 'assistant', text: '', done: false });
        nodes.push(n); log.appendChild(n);
        streaming = { node: n, text: '', msg: d.assistantMessageID || null };
      }
      streaming.text += d.delta || '';
      paintNode(streaming.node, { role: 'assistant', text: streaming.text, done: false });
      streaming.node._sig = 'x'; // не даём поллингу затирать во время потока
      if (nearBottom()) scrollDown(false);
      return;
    }
    if (e.type === 'session.execution.succeeded' || e.type === 'session.execution.failed'
        || e.type === 'session.execution.interrupted') {
      const failed = e.type !== 'session.execution.succeeded';
      if (streaming) {
        paintNode(streaming.node, { role: 'assistant', text: streaming.text || (failed ? '(пусто)' : ''), done: true });
        streaming = null;
      }
      busy = false;
      $('stat').textContent = failed ? 'ошибка' : '';
      notify();
      lastData = null;
      refresh();
      return;
    }
    if (e.type === 'bridge.error') {
      busy = false;
      $('stat').textContent = 'поток недоступен';
    }
  };
  esrc.onerror = () => { /* EventSource сам переподключается */ };
}

function closeStream() { if (esrc) { esrc.close(); esrc = null; } }


function renderChips() {
  $('chips').innerHTML = pendingFiles.map(f => `<span class="chip">${esc(f.name)}</span>`).join('');
}

$('send').onclick = send;
$('text').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$('text').addEventListener('input', e => {
  e.target.style.height = '44px';
  e.target.style.height = Math.min(e.target.scrollHeight, 130) + 'px';
});

log.addEventListener('scroll', () => {
  $('jump').classList.toggle('on', !nearBottom());
});
$('jump').onclick = () => scrollDown(true);

$('attach').onclick = () => $('file').click();
$('file').onchange = async e => {
  for (const f of e.target.files) {
    const fd = new FormData(); fd.append('file', f);
    try {
      const r = await api('/api/upload', { method: 'POST', body: fd });
      pendingFiles.push(r); renderChips();
      $('stat').textContent = 'файл загружен';
    } catch (err) { $('stat').textContent = 'файл не загрузился'; }
  }
  e.target.value = '';
};

/* ---------- микрофон ---------- */
let rec = null, chunks = [];
const MIC_SVG = $('mic').innerHTML;
const STOP_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>';

function logc(msg) {
  try {
    fetch('/api/clientlog', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Bridge-Token': token },
                              body: JSON.stringify({ msg }) }).catch(() => {});
  } catch (_) {}
}
window.addEventListener('error', e => logc('JS error: ' + e.message + ' @' + e.filename + ':' + e.lineno));
window.addEventListener('unhandledrejection', e => logc('JS reject: ' + (e.reason && (e.reason.stack || e.reason.message || e.reason))));

const micOk = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
logc('загрузка: secure=' + window.isSecureContext + ' mediaDevices=' + !!navigator.mediaDevices +
     ' micOk=' + micOk + ' MediaRecorder=' + (typeof MediaRecorder));
if (!micOk) { $('mic').style.opacity = '0.45'; $('mic').title = 'нужен https'; }

$('mic').onclick = async () => {
  if (!micOk) { $('stat').textContent = 'микрофон только на https'; return; }
  if (rec && rec.state === 'recording') { rec.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
    rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    chunks = [];
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      $('mic').classList.remove('rec'); $('mic').innerHTML = MIC_SVG;
      const type = (rec && rec.mimeType) || mime || 'audio/webm';
      const blob = new Blob(chunks, { type });
      $('stat').textContent = 'распознаю…';
      const fd = new FormData(); fd.append('file', blob, 'voice.webm');
      try {
        const r = await api('/api/transcribe', { method: 'POST', body: fd });
        $('text').value = ($('text').value + ' ' + r.text).trim();
        $('text').focus(); $('text').dispatchEvent(new Event('input'));
        $('stat').textContent = '';
      } catch (e) { $('stat').textContent = 'не распозналось'; }
    };
    rec.start(); $('mic').classList.add('rec'); $('mic').innerHTML = STOP_SVG;
    if (navigator.vibrate) navigator.vibrate(20);
  } catch (e) {
    $('stat').textContent = 'микрофон: ' + (e.name || '');
  }
};

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
if (window.Notification && Notification.permission === 'default') {
  setTimeout(() => Notification.requestPermission().catch(() => {}), 4000);
}
if (token) { refresh(); openStream(); }
setInterval(() => { if (token) refresh(); }, 2000);
// сторож потока: если события давно не шли, а ответ ещё "в работе" — переподключаемся
setInterval(() => {
  if (!token || !streaming) { lastEvt = Date.now(); return; }
  if (Date.now() - lastEvt > 25000) { lastEvt = Date.now(); closeStream(); openStream(); refresh(); }
}, 5000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) closeStream();
  else if (token) { openStream(); refresh(); }
});
</script>
</body>
</html>
