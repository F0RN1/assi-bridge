<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Assi</title>
<style>
  :root {
    --bg:#08090b; --surface:#101216; --raised:#171a20; --line:#23282f;
    --txt:#e8eef6; --dim:#8b93a1; --lime:#bbf351; --cyan:#00bcff;
    --danger:#ff5f5f; --ok:#4ade80;
    --ui:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:'Source Code Pro',ui-monospace,'Cascadia Mono',Consolas,monospace;
    --r-lg:18px; --r-md:14px; --r-sm:10px;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { overscroll-behavior:none; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:15px/1.5 var(--ui); display:flex; flex-direction:column; height:100dvh;
         -webkit-font-smoothing:antialiased; }
  ::selection { background:#bbf35133; }

  /* ----- шапка ----- */
  header { display:flex; align-items:center; gap:12px; padding:8px 12px;
           background:#08090bee; backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
           padding-top:calc(8px + env(safe-area-inset-top)); }
  header img.ava { width:38px; height:38px; border-radius:50%; background:var(--raised);
                   flex:none; border:1px solid #bbf35140; }
  .who { display:flex; flex-direction:column; min-width:0; flex:1; }
  .nm { font-weight:600; font-size:16px; color:#f3f7fb; letter-spacing:.2px; }
  .st { font-size:12px; color:var(--dim); white-space:nowrap; overflow:hidden;
        text-overflow:ellipsis; display:flex; align-items:center; gap:6px; }
  .st::before { content:""; width:6px; height:6px; border-radius:50%;
                background:#4b5563; flex:none; transition:background .2s, box-shadow .2s; }
  .st.act { color:var(--lime); }
  .st.act::before { background:var(--lime); box-shadow:0 0 8px #bbf35188; animation:soft 1.4s infinite; }
  @keyframes soft { 0%,100% { opacity:1; } 50% { opacity:.45; } }

  button { background:transparent; color:var(--txt); border:0; min-width:44px; min-height:44px;
           padding:0; flex:none; border-radius:12px; display:flex; align-items:center;
           justify-content:center; cursor:pointer;
           transition:transform .12s ease, background .18s ease, border-color .18s ease, color .18s ease; }
  button:active { transform:scale(.93); }
  button svg { width:22px; height:22px; display:block; }
  button:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }
  #menu, #pw { color:var(--dim); }
  #menu:hover, #pw:hover { background:var(--raised); color:var(--txt); }

  /* ----- лента ----- */
  #log { flex:1; overflow-y:auto; padding:14px 14px 8px; scroll-behavior:smooth;
         -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:min(88%,660px); padding:11px 14px; border-radius:var(--r-md);
         white-space:pre-wrap; word-break:break-word; font-size:15px; line-height:1.55;
         animation:fade .2s cubic-bezier(.2,.8,.3,1); }
  @keyframes fade { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .me { align-self:flex-end; background:#bbf3511f; border:1px solid #bbf3513d;
        border-bottom-right-radius:6px; color:#f0f7e3; }
  .ai { align-self:flex-start; background:var(--surface); border:1px solid var(--line);
        border-bottom-left-radius:6px; color:var(--txt); }
  .ai.pending { color:var(--dim); }
  .err { align-self:flex-start; background:#ff5f5f14; border:1px solid #ff5f5f3d;
         color:#ffa3a3; font-size:13.5px; border-bottom-left-radius:6px; }
  .msg > *:first-child { margin-top:0; }
  .msg > *:last-child { margin-bottom:0; }
  .msg p { margin:0 0 8px; }
  code { font-family:var(--mono); background:#00000055; border:1px solid var(--line);
         padding:1px 5px; border-radius:5px; font-size:13px; color:#b8d2ff; }
  pre { background:#0b0d10; border:1px solid var(--line); border-radius:var(--r-sm);
        padding:11px 13px; overflow-x:auto; margin:8px 0 0; }
  pre code { background:none; border:0; padding:0; color:#c3cee0; font-size:12.5px; }
  .ai a, .me a { color:var(--cyan); text-decoration:none; border-bottom:1px dashed #00bcff55; }
  strong { color:#f3f7fb; font-weight:600; }
  em { color:#a4afc0; }
  .dots { display:inline-flex; gap:5px; align-items:center; height:18px; vertical-align:middle; }
  .dots i { width:6px; height:6px; border-radius:50%; background:var(--lime); opacity:.3;
            animation:blink 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay:.2s; }
  .dots i:nth-child(3) { animation-delay:.4s; }
  @keyframes blink { 0%,60%,100% { opacity:.22; } 30% { opacity:1; } }
  .caret::after { content:"▌"; color:var(--lime); animation:blink 1s steps(1) infinite; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }

  /* ----- вложения ----- */
  .att { display:flex; gap:8px; flex-wrap:wrap; margin-top:9px; }
  .att img { max-width:200px; max-height:200px; border-radius:var(--r-sm); display:block;
             border:1px solid var(--line); }
  .att a.file { display:flex; gap:8px; align-items:center; text-decoration:none; color:var(--txt);
                background:#00000040; border:1px solid var(--line); padding:7px 10px;
                border-radius:var(--r-sm); font-size:12.5px; }
  .att a.file span.n { max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ----- поле ввода ----- */
  footer { display:flex; gap:8px; align-items:flex-end; padding:10px 12px;
           padding-bottom:calc(10px + env(safe-area-inset-bottom));
           border-top:1px solid var(--line); background:#0a0b0e; }
  textarea { flex:1; resize:none; background:var(--surface); color:var(--txt);
             border:1px solid var(--line); border-radius:16px; padding:11px 15px;
             font:15px/1.45 var(--ui); max-height:140px; min-height:44px;
             transition:border-color .18s ease, background .18s ease; }
  textarea:focus { outline:none; border-color:#bbf35166; background:#121419; }
  textarea::placeholder { color:#5f6876; }
  footer button { background:var(--raised); border:1px solid var(--line); border-radius:14px; }
  footer button:hover { border-color:#3a4250; }
  button.send { background:var(--lime); border-color:var(--lime); color:#08090b; }
  button.send svg { stroke:#08090b; }
  button.send:disabled { opacity:.4; }
  /* одна кнопка: пусто — микрофон, есть текст/файлы — отправка */
  #act { background:var(--raised); border:1px solid var(--line); color:var(--dim); }
  #act .i-send { display:none; }
  #act.send { background:var(--lime); border-color:var(--lime); color:#08090b; }
  #act.send .i-mic { display:none; }
  #act.send .i-send { display:block; }
  #act.rec { background:var(--danger); border-color:var(--danger); color:#fff; }
  #act.rec .i-send { display:none; }
  #act.rec .i-mic { display:block; }
  button.rec { background:var(--danger); border-color:var(--danger); color:#fff;
               animation:pulse 1.15s infinite; }
  button.rec svg { stroke:#fff; }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 #ff5f5f77; } 50% { box-shadow:0 0 0 8px #ff5f5f00; } }
  .chips { display:flex; gap:6px; flex-wrap:wrap; padding:8px 12px 0; }  .chip { background:var(--surface); border:1px solid var(--line); color:var(--dim);
          font-size:12.5px; padding:4px 10px; border-radius:999px;
          display:inline-flex; align-items:center; gap:6px; }
  .chip b { color:var(--lime); font-weight:400; }

  /* ----- служебное ----- */
  #jump { position:fixed; right:14px; bottom:84px; width:40px; height:40px; min-width:40px;
          min-height:40px; border-radius:50%; background:var(--raised); border:1px solid var(--line);
          color:var(--dim); opacity:0; pointer-events:none; z-index:20;
          transition:opacity .25s, transform .25s; }
  #jump.on { opacity:1; pointer-events:auto; }
  #setup { padding:20px; display:none; }
  #setup .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
                 padding:20px; max-width:460px; margin:8vh auto 0; }
  #setup h2 { margin:0 0 6px; font-size:18px; font-weight:600; }
  #setup input { width:100%; padding:13px 14px; border-radius:var(--r-md); border:1px solid var(--line);
                 background:#0a0b0e; color:var(--txt); font:14px/1.4 var(--mono); margin:12px 0 4px; }
  #setup input:focus { outline:none; border-color:#bbf35166; }
  #setup button.go { width:100%; margin-top:12px; background:var(--lime); color:#08090b;
                     border-radius:var(--r-md); font:600 15px var(--ui); height:46px; }
  #setup p { color:var(--dim); font-size:13px; line-height:1.5; }

  /* ----- меню питания ----- */
  #sheet { position:fixed; inset:0; display:none; flex-direction:column; justify-content:flex-end;
           background:#000b; backdrop-filter:blur(3px); z-index:40; }
  #sheet.on { display:flex; }
  #sheet .panel { background:var(--surface); border-top:1px solid var(--line);
                  border-radius:20px 20px 0 0; padding:8px 0 calc(12px + env(safe-area-inset-bottom));
                  animation:up .22s cubic-bezier(.2,.8,.3,1); }
  @keyframes up { from { transform:translateY(18px); opacity:.4; } to { transform:none; opacity:1; } }
  #sheet .grab { width:38px; height:4px; border-radius:2px; background:#333a45; margin:6px auto 10px; }
  #sheet .row { display:flex; align-items:center; gap:14px; min-height:52px;
                padding:0 20px; font-size:15px; color:var(--txt); cursor:pointer; }
  #sheet .row svg { width:20px; height:20px; color:var(--dim); flex:none; }
  #sheet .row:active { background:var(--raised); }
  #sheet .row.danger { color:var(--danger); }
  #sheet .row.danger svg { color:var(--danger); }
#sheet .row[data-act="stopserver"] { border-top:1px solid var(--line); margin-top:6px; }

  /* ----- список чатов ----- */
  #drawer { position:fixed; inset:0 auto 0 0; width:min(86vw,340px); background:#0b0d11;
            border-right:1px solid var(--line); transform:translateX(-102%);
            transition:transform .26s cubic-bezier(.2,.8,.3,1); z-index:50;
            display:flex; flex-direction:column; box-shadow:12px 0 32px #0008; }
  #drawer.on { transform:none; }
  #veil { position:fixed; inset:0; background:#0009; opacity:0; pointer-events:none;
          transition:opacity .26s; z-index:45; }
  #veil.on { opacity:1; pointer-events:auto; }
  .dhead { padding:calc(16px + env(safe-area-inset-top)) 18px 12px; border-bottom:1px solid var(--line);
           font:600 12px var(--ui); color:var(--dim); text-transform:uppercase; letter-spacing:1.4px; }
  #newchat { margin:12px 14px; width:auto; height:46px; gap:9px; background:#bbf35114;
             border:1px solid #bbf35140; border-radius:var(--r-md); font:500 14px var(--ui);
             color:var(--lime); }
  #newchat svg { width:17px; height:17px; }
  #list { flex:1; overflow-y:auto; padding:4px 10px 24px; display:flex; flex-direction:column; gap:4px; }
  .sess { padding:11px 12px; border-radius:var(--r-md); display:flex; flex-direction:column;
          gap:3px; cursor:pointer; border:1px solid transparent; }
  .sess .t { color:var(--txt); font-size:14px; overflow:hidden; text-overflow:ellipsis;
             white-space:nowrap; }
  .sess .m { color:var(--dim); font-size:11.5px; }
  .sess:active { background:var(--raised); }
  .sess.cur { background:#bbf3510f; border-color:#bbf35133; }
  .sess.cur .t { color:var(--lime); }

  /* ----- файлы ПК -> телефон ----- */
  #files { position:fixed; inset:0; background:var(--bg); z-index:60; display:none; flex-direction:column; }
  #files.on { display:flex; }
  .fhead { display:flex; align-items:center; gap:10px; padding:calc(12px + env(safe-area-inset-top)) 14px 10px;
           border-bottom:1px solid var(--line); }
  .fhead .ttl { font:600 15px var(--ui); }
  .fhead #fup { margin-left:auto; width:40px; height:40px; min-width:40px; border-radius:11px;
                background:#00bcff14; border:1px solid #00bcff40; color:var(--cyan); display:grid; place-items:center; }
  .fhead #fup:active { background:#00bcff24; }
  .crumbs { display:flex; overflow-x:auto; gap:6px; padding:8px 14px; border-bottom:1px solid var(--line);
            scrollbar-width:none; }
  .crumbs::-webkit-scrollbar { display:none; }
  .crumb { flex:none; font:500 12px var(--mono); color:var(--dim); padding:6px 9px; border-radius:8px;
           background:var(--surface); border:1px solid var(--line); max-width:170px;
           overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .crumb:last-child { color:var(--lime); border-color:#bbf3513d; }
  #flist { flex:1; overflow-y:auto; padding-bottom:24px; }
  .frow { display:flex; align-items:center; gap:12px; padding:11px 16px; border-bottom:1px solid #1a1f26; }
  .frow:active { background:var(--raised); }
  .frow .ic { width:32px; height:32px; flex:none; display:grid; place-items:center; border-radius:9px;
              background:var(--surface); border:1px solid var(--line); color:var(--dim); }
  .frow.dir .ic { color:var(--lime); border-color:#bbf35133; background:#bbf3510f; }
  .frow .nn { flex:1; min-width:0; }
  .frow .nm { font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .frow .meta { font:11.5px var(--mono); color:var(--dim); margin-top:2px; }
  .frow .dl { flex:none; width:40px; height:40px; border-radius:11px; background:#bbf35114;
              border:1px solid #bbf35140; color:var(--lime); display:grid; place-items:center; }
  .fnote { padding:14px 16px; font-size:12.5px; color:var(--dim); }
  a.dlfile { color:var(--cyan); text-decoration:none; border-bottom:1px dashed #00bcff66; word-break:break-all; }
  /* всплывашка «файл доставлен» */  #toast { position:fixed; left:50%; bottom:96px; transform:translate(-50%, 14px); z-index:70;
           display:flex; align-items:center; gap:10px; max-width:calc(100% - 32px);
           padding:11px 16px; border-radius:14px; background:#11150f; color:var(--txt);
           border:1px solid #bbf35155; box-shadow:0 10px 30px #0009;
           font:13.5px/1.35 var(--ui); opacity:0; pointer-events:none;
           transition:opacity .2s ease, transform .2s ease; }
  #toast.on { opacity:1; transform:translate(-50%, 0); }
  #toast svg { flex:none; width:18px; height:18px; stroke:var(--lime); }
  #toast b { font-weight:600; }
  /* гостевой экземпляр: кнопки доступа к компьютеру скрыты */
  body.guest #fs, body.guest #pw { display:none; }
</style>
</head>
<body>
<header>
  <button id="menu" title="чаты" aria-label="чаты">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
      <path d="M4 7h16M4 12h16M4 17h10"/>
    </svg>
  </button>
  <img class="ava" src="/icon-192.png?v=4" alt="">
  <div class="who">
    <div class="nm">Assi</div>
    <div class="st" id="stat">ждёт</div>
  </div>
  <button id="fs" title="файлы" aria-label="файлы компьютера">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 7.5A2.5 2.5 0 015.5 5h3.2l2 2.4h7.8A2.5 2.5 0 0121 10v7a2 2 0 01-2 2H5a2 2 0 01-2-2V7.5z"/>
    </svg>
  </button>
  <button id="pw" title="питание" aria-label="питание">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3v9"/><path d="M6.4 6.4a8 8 0 1011.2 0"/>
    </svg>
  </button>
</header>

<div id="veil"></div>
<aside id="drawer">
  <div class="dhead">Чаты</div>
  <button id="newchat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M12 5v14M5 12h14"/>
    </svg>
    новый чат
  </button>
  <div id="list"></div>
</aside>

<div id="sheet">
  <div class="panel">
    <div class="grab"></div>
    <div class="row" data-act="wake">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9"/><path d="M6.4 6.4a8 8 0 1011.2 0"/></svg>
      Разбудить (WOL)
    </div>
    <div class="row" data-act="sleep">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 019.5 4a8.2 8.2 0 1010.5 10.5z"/></svg>
      Сон
    </div>
    <div class="row" data-act="lock">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2.5"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
      Заблокировать
    </div>
    <div class="row" data-act="reboot">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 11-2.3-5.6"/><path d="M20 4v5h-5"/></svg>
      Перезагрузить
    </div>
    <div class="row danger" data-act="shutdown">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5"/></svg>
      Выключить
    </div>
    <div class="row danger" data-act="stopserver" id="stoprow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>
      Остановить сервер
    </div>
  </div>
</div>

<div id="files" role="dialog" aria-label="файлы компьютера">
  <div class="fhead">
    <button id="fclose" aria-label="закрыть">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M15 5l-7 7 7 7"/>
      </svg>
    </button>
    <div class="ttl">Файлы компьютера</div>
    <button id="fup" title="залить файл с телефона в эту папку" aria-label="залить файл с телефона в эту папку">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20V8"/><path d="M7 13l5-5 5 5"/><path d="M5 4h14"/>
      </svg>
    </button>
  </div>
  <div class="crumbs" id="crumbs"></div>
  <div id="flist"></div>
</div>

<div id="setup">
  <div class="card">
    <h2>Подключение</h2>
    <p>Вставь <b>код подключения</b> целиком — строка вида <span style="font-family:var(--mono)">https://адрес/?token=…</span>. Её показывает установщик на компьютере и страница <span style="font-family:var(--mono)">/local</span>.</p>
    <input id="tok" placeholder="код подключения или токен" autocomplete="off">
    <p id="tokmsg"></p>
    <button class="go" id="tokgo">Подключиться</button>
  </div>
</div>

<div id="log"></div>
<div class="chips" id="chips"></div>
<footer>
  <button id="attach" title="файл" aria-label="прикрепить файл">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21.4 11.05l-8.6 8.6a5.5 5.5 0 01-7.78-7.78l8.6-8.6a3.7 3.7 0 015.23 5.23l-8.6 8.6a1.85 1.85 0 01-2.62-2.62l7.9-7.9"/>
    </svg>
  </button>
  <textarea id="text" rows="1" placeholder="написать…"></textarea>
  <button id="act" title="голос" aria-label="записать голос">
    <svg class="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="3" width="6" height="11" rx="3"/>
      <path d="M5 11a7 7 0 0014 0M12 18v3M9 21h6"/>
    </svg>
    <svg class="i-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 19V5M6 11l6-6 6 6"/>
    </svg>
  </button>
</footer>
<button id="jump" title="вниз" aria-label="вниз">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
</button>
<input id="fsfile" type="file" multiple hidden>
<input id="file" type="file" multiple hidden>
<div id="toast" role="status" aria-live="polite">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
  <span id="toasttxt"></span>
</div>

<script>
const $ = id => document.getElementById(id);
let token = localStorage.getItem('token') || new URLSearchParams(location.search).get('token') || '';
if (new URLSearchParams(location.search).get('token')) localStorage.setItem('token', token);
let pendingFiles = [];
let nodes = [];
let busy = false;
let curSid = null, streamSid = null;

/* статус в шапке: "ждёт" / "думает…" / "печатает…" / "смотрит файл…" / "распознаёт…" */
function setStat(text, active) {
  const el = $('stat');
  el.textContent = text || 'ждёт';
  el.classList.toggle('act', !!active);
}

function showSetup(on) {
  $('setup').style.display = on ? 'block' : 'none';
  document.querySelector('footer').style.display = on ? 'none' : 'flex';
}
if (!token) showSetup(true);

/* Ввод токена: чистим вставленное (кавычки, пробелы, ссылка целиком), проверяем сразу и стартуем без перезагрузки */
function cleanToken(v) {
  let s = String(v || '').trim();
  const i = s.indexOf('token=');
  if (i >= 0) s = s.slice(i + 6);
  s = s.split('&')[0];
  s = s.replace(/^[\s"'`«»]+|[\s"'`«».]+$/g, '');
  return s;
}
async function startWithToken(value) {
  const raw = String(value || '').trim();
  // вставили код подключения целиком (https://адрес/?token=…) — переходим на этот сервер
  const m = raw.match(/^(https?:\/\/[^\s/]+)/i);
  if (m && m[1].replace(/\/$/, '') !== location.origin) {
    location.href = m[1].replace(/\/$/, '') + '/?token=' + encodeURIComponent(cleanToken(raw));
    return;
  }
  token = cleanToken(value);
  localStorage.setItem('token', token);
  const msg = $('tokmsg');
  if (!token) { if (msg) msg.textContent = ''; showSetup(true); return; }
  if (msg) msg.textContent = 'проверяю…';
  try {
    const r = await fetch('/api/history', { headers: { 'X-Bridge-Token': token } });
    if (r.status === 401) {
      localStorage.removeItem('token');
      token = '';
      if (msg) msg.textContent = 'токен не подошёл — скопируй целиком и вставь заново';
      showSetup(true);
      return;
    }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    if (msg) msg.textContent = '';
    _netState = true;
    showSetup(false);
    nodes = [];
    $('log').innerHTML = '';
    refresh(); loadSessions(); openStream();
  } catch (e) {
    if (msg) msg.textContent = 'не удалось проверить: ' + (e.message || e);
  }
}
$('tok').addEventListener('change', e => startWithToken(e.target.value));
$('tok').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); startWithToken(e.target.value); } });
$('tokgo').addEventListener('click', () => startWithToken($('tok').value));

async function api(path, opts = {}) {
  const isGet = !opts.method || opts.method === 'GET';
  const tries = isGet ? 4 : 1;   // POST не ретраим: повтор = задвоенный файл или промпт
  const timeout = opts.timeout || (isGet ? 15000 : 120000);   // upload большого файла через туннель идёт дольше 15 с
  let lastErr;
  for (let attempt = 0; attempt < tries; attempt++) {
    try {
      const ctl = new AbortController();
      const t = setTimeout(() => ctl.abort(), timeout);
      const r = await fetch(path, { ...opts, signal: ctl.signal, headers: { 'X-Bridge-Token': token, ...(opts.headers || {}) } });
      clearTimeout(t);
      if (r.status === 401) { localStorage.removeItem('token'); showSetup(true); throw new Error('токен'); }
      if (!r.ok) throw new Error((await r.text()).slice(0, 300));
      netOk();
      return r.json();
    } catch (e) {
      if (e.message === 'токен') throw e;
      lastErr = e;
      if (attempt < 3) await new Promise(res => setTimeout(res, 1000 * (attempt + 1) * 2));
    }
  }
  netDown();
  throw lastErr;
}
let _netState = true;
function netDown() { if (_netState) { _netState = false; setStat('нет связи, пробую ещё', false); } }
function netOk() { if (!_netState) { _netState = true; logc('связь восстановлена'); } }

/* ---------- минимальный markdown ---------- */
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function md(src) {
  const parts = [];
  let text = src.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    parts.push('<pre><code>' + esc(code.replace(/\n$/, '')) + '</code></pre>');
    return '\u0000' + (parts.length - 1) + '\u0000';
  });
  text = esc(text)
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  text = text.replace(/\u0000(\d+)\u0000/g, (_, i) => parts[+i]);
  return text;
}

const IMG = /\.(png|jpe?g|webp|gif|heic)$/i;

function fileEl(path) {
  const name = path.split(/[\\/]/).pop();
  const url = '/api/file?t=' + encodeURIComponent(token) + '&path=' + encodeURIComponent(path);
  if (IMG.test(name)) {
    const a = document.createElement('a');
    a.href = url; a.target = '_blank'; a.rel = 'noopener';
    const img = document.createElement('img');
    img.src = url; img.alt = name; img.loading = 'lazy';
    a.appendChild(img);
    return a;
  }
  const a = document.createElement('a');
  a.className = 'file'; a.href = url; a.target = '_blank'; a.rel = 'noopener';
  a.innerHTML = '<span>▤</span><span class="n"></span>';
  a.querySelector('.n').textContent = name;
  return a;
}

/* ---------- отрисовка ---------- */
const log = $('log');
const nearBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 90;

function scrollDown(instant) {
  if (instant) log.scrollTop = log.scrollHeight;
  else log.scrollTo({ top: log.scrollHeight, behavior: 'smooth' });
}

function makeNode(m) {
  const d = document.createElement('div');
  d.className = 'msg ' + (m.role === 'user' ? 'me' : m.error ? 'err' : 'ai');
  d._text = document.createElement('div');
  d.appendChild(d._text);
  d._sig = '';
  return d;
}

function paintNode(d, m) {
  if (m.role === 'user') {
    const sig = 'u' + m.text + '|' + (m.files || []).join(',');
    if (d._sig === sig) return false;
    d._sig = sig;
    d._text.innerHTML = md(m.text || '');
    linkPaths(d._text);
    d.querySelectorAll('.att').forEach(n => n.remove());
    if (m.files && m.files.length) {
      const box = document.createElement('div');
      box.className = 'att';
      m.files.forEach(f => box.appendChild(fileEl(f)));
      d.appendChild(box);
    }
    return true;
  }
  if (m.error) {
    const sig = 'e' + m.error;
    if (d._sig === sig) return false;
    d._sig = sig;
    d._text.textContent = '⚠ ' + m.error;
    return true;
  }
  const sig = 'a' + (m.text || '') + '|' + (m.done ? 1 : 0);
  if (d._sig === sig) return false;
  d._sig = sig;
  if (m.done && !m.text) {
    // служебный шаг агента (вызов инструментов) — пузырь не показываем
    d.style.display = 'none';
    return true;
  }
  d.style.display = '';
  if (!m.text) {
    d._text.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  } else if (m.done) {
    d._text.innerHTML = md(m.text);
    linkPaths(d._text);
    d._text.classList.remove('caret');
  } else {
    d._text.innerHTML = md(m.text);
    linkPaths(d._text);
    d._text.classList.add('caret');
  }
  d.classList.toggle('pending', !m.done);
  return true;
}

function render(messages) {
  const stick = nearBottom();
  if (messages.length < nodes.length) {
    log.innerHTML = ''; nodes = [];
  }
  let changed = false;
  messages.forEach((m, i) => {
    if (!nodes[i]) { nodes[i] = makeNode(m); log.appendChild(nodes[i]); changed = true; }
    if (paintNode(nodes[i], m)) changed = true;
  });
  while (nodes.length > messages.length) { nodes.pop().remove(); changed = true; }
  if (stick && changed) scrollDown(false);
}

function notify() {
  if (navigator.vibrate) navigator.vibrate(35);
  if (document.hidden && window.Notification && Notification.permission === 'granted') {
    new Notification('Assi', { body: 'ответила', icon: '/icon-192.png?v=4' });
  }
}

/* ---------- обмен ---------- */
let spinning = false;
async function refresh() {
  if (spinning) return;
  spinning = true;
  try {
    const h = await api('/api/history');
    const msgs = h.messages;
    if (h.session !== curSid) { curSid = h.session; paintSessions(); }
    reconcile(msgs);
    if (!streaming) render(msgs);
    if (!busy && !streaming) setStat('ждёт', false);
  } catch (e) {
    // статус уже поставлен netDown() внутри api(); повторная попытка — на следующем тике
  }
  spinning = false;
}

function reconcile(msgs) {
  if (!busy && !streaming) return;
  const lastUser = msgs.map(m => m.role).lastIndexOf('user');
  const tail = lastUser < 0 ? msgs : msgs.slice(lastUser + 1);
  const done = tail.filter(m => m.role === 'assistant' && m.done).pop();
  if (!done) return;
  if (streaming) {
    paintNode(streaming.node, { role: 'assistant', text: done.text || streaming.text, done: true });
    streaming = null;
  }
  busy = false;
  setStat('ждёт', false);
  notify();
}

async function send() {
  const text = $('text').value.trim();
  if ((!text && !pendingFiles.length) || busy) return;
  const files = pendingFiles.slice();
  pendingFiles = []; renderChips();
  $('text').value = ''; $('text').style.height = '42px';
  actMode();
  busy = true;
  setStat('думает…', true);
  const guess = { role: 'user', text, files: files.map(f => f.path) };
  nodes.push(makeNode(guess)); log.appendChild(nodes[nodes.length - 1]);
  paintNode(nodes[nodes.length - 1], guess);
  const draft = makeNode({ role: 'assistant', text: '', done: false });
  paintNode(draft, { role: 'assistant', text: '', done: false });
  nodes.push(draft); log.appendChild(draft);
  streaming = { node: draft, text: '', msg: null };
  streamSid = curSid;
  scrollDown(true);
  if (navigator.vibrate) navigator.vibrate(15);
  try {
    await api('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                             body: JSON.stringify({ text, files: files.map(f => f.path) }) });
  } catch (e) {
    const err = makeNode({ role: 'assistant', error: e.message });
    paintNode(err, { role: 'assistant', error: e.message });
    nodes.push(err); log.appendChild(err);
    streaming = null; busy = false; setStat('ошибка', false);
  }
}

/* ---------- поток ответа (SSE) ---------- */
let streaming = null, esrc = null, lastEvt = Date.now();

function openStream() {
  if (esrc || !token) return;
  try { esrc = new EventSource('/api/stream?t=' + encodeURIComponent(token)); }
  catch (_) { esrc = null; return; }
  esrc.onmessage = ev => {
    lastEvt = Date.now();
    let e;
    try { e = JSON.parse(ev.data); } catch (_) { return; }
    const d = e.data || {};
    if (e.type === 'session.text.started') {
      setStat('печатает…', true);
      if (!streaming) {
        const n = makeNode({ role: 'assistant', text: '', done: false });
        paintNode(n, { role: 'assistant', text: '', done: false });
        nodes.push(n); log.appendChild(n);
        streaming = { node: n, text: '', msg: null };
      }
      streaming.msg = d.assistantMessageID || null;
      if (nearBottom()) scrollDown(false);
      return;
    }
    if (e.type === 'session.text.delta') {
      setStat('печатает…', true);
      if (!streaming) {
        const n = makeNode({ role: 'assistant', text: '', done: false });
        nodes.push(n); log.appendChild(n);
        streaming = { node: n, text: '', msg: d.assistantMessageID || null };
      }
      streaming.text += d.delta || '';
      paintNode(streaming.node, { role: 'assistant', text: streaming.text, done: false });
      streaming.node._sig = 'x';
      if (nearBottom()) scrollDown(false);
      return;
    }
    if (e.type === 'session.execution.succeeded' || e.type === 'session.execution.failed'
        || e.type === 'session.execution.interrupted') {
      const failed = e.type !== 'session.execution.succeeded';
      if (streaming) {
        paintNode(streaming.node, { role: 'assistant', text: streaming.text || (failed ? '(пусто)' : ''), done: true });
        streaming = null;
      }
      busy = false;
      setStat(failed ? 'ошибка' : 'ждёт', false);
      notify();
      refresh();
      return;
    }
    if (e.type === 'bridge.error') {
      busy = false;
      setStat('поток недоступен', false);
    }
  };
  esrc.onerror = () => { /* EventSource сам переподключается */ };
}

function closeStream() { if (esrc) { esrc.close(); esrc = null; } }

function renderChips() {
  $('chips').innerHTML = pendingFiles.map(f => `<span class="chip"><b>▤</b> ${esc(f.name)}</span>`).join('');
}

try { actMode(); } catch (_) {}

/* ---------- список чатов ---------- */
let sessions = [];

function fmtTime(ms) {
  if (!ms) return '';
  const d = new Date(ms), now = new Date();
  const hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  if (d.toDateString() === now.toDateString()) return hm;
  const dm = String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0');
  return dm + ' ' + hm;
}

function paintSessions() {
  const box = $('list');
  if (!sessions.length) { box.innerHTML = '<div class="sess"><div class="m">пока пусто</div></div>'; return; }
  box.innerHTML = '';
  sessions.forEach(s => {
    const d = document.createElement('div');
    d.className = 'sess' + (s.id === curSid ? ' cur' : '');
    const t = document.createElement('div'); t.className = 't'; t.textContent = s.title;
    const m = document.createElement('div'); m.className = 'm';
    m.textContent = fmtTime(s.updated) + (s.agent ? ' · ' + s.agent : '');
    d.append(t, m);
    d.onclick = () => selectSession(s.id);
    box.appendChild(d);
  });
}

async function loadSessions() {
  try {
    const r = await api('/api/sessions');
    sessions = r.sessions || [];
    if (r.current) curSid = r.current;
    paintSessions();
  } catch (_) {}
}

function openDrawer(on) {
  $('drawer').classList.toggle('on', on);
  $('veil').classList.toggle('on', on);
  if (on) loadSessions();
}

async function selectSession(id) {
  if (id === curSid) { openDrawer(false); return; }
  try {
    await api('/api/session/select', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                       body: JSON.stringify({ id }) });
    curSid = id;
    log.innerHTML = ''; nodes = []; streaming = null; busy = false;
    closeStream(); openStream();
    await refresh();
    openDrawer(false);
    paintSessions();
  } catch (e) { setStat('не переключилось', false); }
}

$('menu').onclick = () => openDrawer(true);
$('veil').onclick = () => openDrawer(false);
$('newchat').onclick = async () => {
  try {
    const r = await api('/api/session/new', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    curSid = r.session;
    log.innerHTML = ''; nodes = []; streaming = null; busy = false;
    closeStream(); openStream();
    setStat('ждёт', false);
    openDrawer(false);
    await loadSessions();
  } catch (e) { setStat('не создался', false); }
};

/* ---------- обработчики ---------- */
function actMode() {
  const on = !!($('text').value.trim() || pendingFiles.length);
  $('act').classList.toggle('send', on);
  const lbl = on ? 'отправить' : 'записать голос';
  $('act').setAttribute('aria-label', lbl);
  $('act').title = on ? 'отправить' : 'голос';
}
$('text').addEventListener('input', actMode);
$('act').addEventListener('pointerdown', e => {
  if ($('act').classList.contains('send')) return;
  e.preventDefault();
  micStart();
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(t =>
  $('act').addEventListener(t, () => { if (!$('act').classList.contains('send')) micStop(); }));
$('act').addEventListener('click', e => {
  if ($('act').classList.contains('send')) { e.preventDefault(); send(); }
});
$('text').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$('text').addEventListener('input', e => {
  e.target.style.height = '42px';
  e.target.style.height = Math.min(e.target.scrollHeight, 140) + 'px';
});

log.addEventListener('scroll', () => {
  $('jump').classList.toggle('on', !nearBottom());
});
$('jump').onclick = () => scrollDown(true);

$('attach').onclick = () => $('file').click();
$('file').onchange = async e => {
  setStat('смотрит файл…', true);
  for (const f of e.target.files) {
    const fd = new FormData(); fd.append('file', f);
    try {
      const r = await api('/api/upload', { method: 'POST', body: fd });
      pendingFiles.push(r); renderChips();
    } catch (err) { setStat('файл не загрузился', false); }
  }
  setStat('ждёт', false);
  e.target.value = '';
};

/* ---------- файлы компьютера -> телефон ---------- */
const fsBox = $('files'), fsList = $('flist'), fsCrumbs = $('crumbs');
let fsPaths = [];

function fsOpen() { fsBox.classList.add('on'); fsLoad(fsPaths.length ? fsPaths[fsPaths.length - 1] : ''); }
function fsClose() { fsBox.classList.remove('on'); }

function fsSize(n) {
  const u = ['Б', 'КБ', 'МБ', 'ГБ']; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i ? n.toFixed(1) : n.toFixed(0)) + ' ' + u[i];
}

function fsCrumbsRender(p) {
  fsCrumbs.innerHTML = '';
  const mk = (label, path) => {
    const b = document.createElement('button');
    b.className = 'crumb'; b.textContent = label; b.dataset.path = path;
    fsCrumbs.appendChild(b);
  };
  mk('Компьютер', '');
  if (p) {
    const parts = p.split(/[\\/]+/).filter(Boolean);
    let acc = '';
    parts.forEach((seg, i) => {
      acc += (i === 0 && /^[A-Za-z]:$/.test(seg)) ? seg + '\\' : (acc.endsWith('\\') || acc === '' ? seg : '\\' + seg);
      mk(seg, acc);
    });
  }
  fsCrumbs.scrollLeft = fsCrumbs.scrollWidth;
}

function fsIcon(dir, ext) {
  if (dir) return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 015.5 5h3.2l2 2.4h7.8A2.5 2.5 0 0121 10v7a2 2 0 01-2 2H5a2 2 0 01-2-2V7.5z"/></svg>';
  if (['jpg','jpeg','png','gif','webp','bmp'].includes(ext)) return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 3.5 3.5L16 13l4 4"/></svg>';
  if (['mp4','mkv','mov','avi','webm'].includes(ext)) return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>';
  if (['mp3','wav','flac','ogg','m4a'].includes(ext)) return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2.4"/><circle cx="17" cy="16" r="2.4"/></svg>';
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/></svg>';
}

function fsRow(e) {
  const row = document.createElement('div');
  row.className = 'frow' + (e.dir ? ' dir' : '');
  const ic = document.createElement('div'); ic.className = 'ic'; ic.innerHTML = fsIcon(e.dir, e.ext || '');
  const nn = document.createElement('div'); nn.className = 'nn';
  const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = e.name;
  const meta = document.createElement('div'); meta.className = 'meta';
  meta.textContent = e.dir ? 'папка' : [e.size_text, e.mtime ? new Date(e.mtime * 1000).toLocaleDateString('ru-RU') : ''].filter(Boolean).join(' · ');
  nn.append(nm, meta);
  row.append(ic, nn);
  if (e.dir) {
    row.onclick = () => fsLoad(e.path);
  } else {
    const dl = document.createElement('button');
    dl.className = 'dl'; dl.title = 'скачать на телефон';
    dl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>';
    dl.onclick = ev => { ev.stopPropagation(); fsDownload(e.path, e.name); };
    row.append(dl);
    row.onclick = () => fsDownload(e.path, e.name);
  }
  return row;
}

function fsDownload(path, name) {
  if (!token) return;
  setStat('качаю…', true);
  const url = '/api/fs/download?t=' + encodeURIComponent(token) + '&path=' + encodeURIComponent(path);
  const base = name || path.split(/[\\/]/).pop() || 'file';
  const abs = location.origin + url;   // DownloadManager требует абсолютный http(s)
  if (window.AssiNative && AssiNative.download) {
    try { AssiNative.download(abs, base); logc('dl: ' + base); }
    catch (e) { logc('dl err: ' + e); location.href = url; }
  } else {
    logc('dl web: ' + base);
    location.href = url;
  }
  setTimeout(() => setStat('ждёт', false), 1500);
}

async function fsLoad(path) {
  if (!token) return;
  fsList.innerHTML = '<div class="fnote">читаю папку…</div>';
  try {
    const r = await api('/api/fs/list' + (path ? '?path=' + encodeURIComponent(path) : ''));
    fsPaths = path ? (fsPaths.includes(r.path) ? fsPaths.slice(0, fsPaths.indexOf(r.path) + 1) : fsPaths.concat(r.path)) : [];
    fsCrumbsRender(r.path || '');
    fsList.innerHTML = '';
    if (!r.entries.length) { fsList.innerHTML = '<div class="fnote">папка пустая</div>'; return; }
    r.entries.forEach(e => fsList.appendChild(fsRow(e)));
  } catch (err) {
    fsList.innerHTML = '<div class="fnote">не открылось: ' + esc(err.message) + '</div>';
  }
}

/* абсолютные пути в ответах агента делаем ссылкой «скачать на телефон» */
const PATH_RE = /[A-Za-z]:\\[^\s<>"'`]{3,}/g;
function linkPaths(el) {
  if (!el) return;
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
  const texts = [];
  while (walker.nextNode()) texts.push(walker.currentNode);
  texts.forEach(t => {
    const s = t.nodeValue || '';
    if (s.indexOf(':\\') < 0) return;
    PATH_RE.lastIndex = 0;
    if (!PATH_RE.test(s)) return;
    PATH_RE.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0, m;
    while ((m = PATH_RE.exec(s))) {
      const raw = m[0].replace(/[.,;:)\]]+$/, '');
      if (raw.length < 6) continue;
      frag.appendChild(document.createTextNode(s.slice(last, m.index)));
      const a = document.createElement('a');
      a.className = 'dlfile'; a.href = '#'; a.textContent = raw; a.dataset.path = raw;
      frag.appendChild(a);
      last = m.index + raw.length;
    }
    if (!last) return;
    frag.appendChild(document.createTextNode(s.slice(last)));
    t.parentNode.replaceChild(frag, t);
  });
}

$('fs').onclick = fsOpen;
$('fclose').onclick = fsClose;
$('fup').onclick = () => {
  if (!fsPaths.length) { setStat('сначала открой папку', false); return; }
  $('fsfile').click();
};
$('fsfile').onchange = async e => {
  const dir = fsPaths[fsPaths.length - 1];
  if (!dir) return;
  const files = Array.from(e.target.files || []);
  e.target.value = '';
  let done = 0;
  for (const f of files) {
    setStat('загружаю ' + f.name + '…', true);
    const fd = new FormData();
    fd.append('file', f);
    try {
      const r = await api('/api/fs/upload?path=' + encodeURIComponent(dir), { method: 'POST', body: fd });
      done++;
      logc('up: ' + r.path);
    } catch (err) {
      setStat('не залилось: ' + err.message, false);
    }
  }
  if (navigator.vibrate) navigator.vibrate(20);
  setStat(done ? 'в папке: ' + done + ' файл(ов)' : 'ждёт', false);
  if (done) toast('Файл на компьютере: ' + (done > 1 ? done + ' шт.' : 'готово'));
  fsLoad(dir);
};
fsCrumbs.addEventListener('click', e => {
  const b = e.target.closest('.crumb');
  if (b) fsLoad(b.dataset.path || '');
});
log.addEventListener('click', e => {
  const a = e.target.closest('a.dlfile');
  if (!a) return;
  e.preventDefault();
  fsDownload(a.dataset.path, a.dataset.path.split(/[\\/]/).pop());
});

/* ---------- питание ---------- */
/* После остановки сервера ждём, пока порт займёт wake_gate, и уходим на страницу «Сервер выключен». */
async function waitForStop() {
  setStat('останавливаю сервер…', true);
  for (let i = 0; i < 40; i++) {
    await new Promise(r => setTimeout(r, 800));
    try {
      const r = await fetch('/api/ping?_=' + Date.now(), { cache: 'no-store' });
      const j = await r.json();
      if (j.wake || !j.ok) {
        location.replace('/' + (token ? '?token=' + encodeURIComponent(token) : ''));
        return;
      }
    } catch (_) { /* мост уже упал, gate ещё поднимается */ }
  }
  location.reload();
}
const NAMES = { wake: 'Разбудить ноут (WOL)?', lock: 'Заблокировать ноут?', sleep: 'Усыпить ноут?', reboot: 'Перезагрузить ноут?', shutdown: 'Выключить ноут?', stopserver: 'Остановить сервер? Чат замолчит, пока не включишь его снова с телефона.' };
$('pw').onclick = () => { if (!token) return; $('sheet').classList.add('on'); };
$('sheet').onclick = async (e) => {
  if (e.target === $('sheet')) { $('sheet').classList.remove('on'); return; }
  const act = e.target.dataset.act;
  if (!act) return;
  $('sheet').classList.remove('on');
  if (!confirm(NAMES[act])) return;
  if (act === 'stopserver') {
    try {
      await api('/api/server', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'stop' }) });
      if (navigator.vibrate) navigator.vibrate(30);
      toast('Сервер выключается…');
      waitForStop();
    } catch (_) { setStat('не получилось', false); }
    return;
  }
  try {
    if (act === 'wake' && window.AssiNative && AssiNative.hasWol()) {
      const info = await api('/api/wol-info').catch(() => null);
      const ok = AssiNative.wake(info ? info.mac : '', info ? info.broadcasts : '');
      setStat(ok ? 'сигнал пробуждения ушёл' : 'не смог отправить', false);
      if (navigator.vibrate) navigator.vibrate(30);
      return;
    }
    await api('/api/power', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: act }) });
    setStat(act === 'lock' ? 'заблокировано' : 'команда ушла', false);
    if (navigator.vibrate) navigator.vibrate(30);
  } catch (_) { setStat('не получилось', false); }
};

/* в приложении запоминаем MAC ноута — чтобы «Разбудить» работало, даже когда сервер спит */
/* какие действия питания включены на сервере — остальные кнопки не показываем */
function applyPowerCaps(list) {
  const ok = new Set(Array.isArray(list) ? list : []);
  document.querySelectorAll('#sheet .row[data-act]').forEach(r => {
    const a = r.dataset.act;
    const native = (a === 'wake' && !!window.AssiNative) || a === 'stopserver';  // WOL шлёт приложение, стоп-сервер есть всегда
    r.style.display = (ok.has(a) || native) ? '' : 'none';
  });
}

api('/api/wol-info').then(i => {
  if (window.AssiNative) { try { AssiNative.setWol(i.mac, i.broadcasts); } catch (_) {} }
  applyPowerCaps(i.actions);
}).catch(() => {});

/* ---------- микрофон ---------- */
let rec = null, chunks = [], recStart = 0, recStarting = false;

function logc(msg) {
  try {
    fetch('/api/clientlog', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Bridge-Token': token },
                              body: JSON.stringify({ msg }) }).catch(() => {});
  } catch (_) {}
}
window.addEventListener('error', e => logc('JS error: ' + e.message + ' @' + e.filename + ':' + e.lineno));
window.addEventListener('unhandledrejection', e => logc('JS reject: ' + (e.reason && (e.reason.stack || e.reason.message || e.reason))));

const micOk = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
logc('загрузка: secure=' + window.isSecureContext + ' mediaDevices=' + !!navigator.mediaDevices +
     ' micOk=' + micOk + ' MediaRecorder=' + (typeof MediaRecorder) +
     ' href=' + location.href + ' sw=' + (navigator.serviceWorker && navigator.serviceWorker.controller ? 'yes' : 'no') +
     ' ua=' + navigator.userAgent.slice(0, 60));
if (!micOk) { $('act').title = 'микрофон только на https'; }

/* Микрофон открывается только по нажатию и освобождается сразу после записи:
   иначе система считает, что идёт звонок, и портит вывод звука (музыка в наушниках падает в моно/тише). */
/* одна кнопка: пусто — микрофон (зажать), есть текст — отправка */
function micStop() {
  if (rec && rec.state === 'recording') { try { rec.stop(); } catch (_) {} }
}

async function micStart() {
  if (!micOk) { setStat('микрофон только на https', false); return; }
  if (rec && rec.state === 'recording') return;
  if (recStarting) return;
  recStarting = true;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 }
    });
    const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
    rec = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 64000 } : undefined);
    chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = async () => {
      const secs = ((Date.now() - recStart) / 1000).toFixed(1);
      $('act').classList.remove('rec');
      const type = (rec && rec.mimeType) || mime || 'audio/webm';
      const blob = new Blob(chunks, { type });
      stream.getTracks().forEach(t => t.stop());   // сразу отпускаем микрофон
      rec = null;
      logc('mic: запись ' + secs + 's, ' + blob.size + ' байт, mime=' + type);
      setStat('распознаёт…', true);
      const fd = new FormData();
      fd.append('file', blob, 'voice.webm');
      fd.append('seconds', secs);
      try {
        const r = await api('/api/transcribe', { method: 'POST', body: fd });
        $('text').value = ($('text').value + ' ' + r.text).trim();
        $('text').focus(); $('text').dispatchEvent(new Event('input'));
        setStat('ждёт', false);
      } catch (e) { setStat('не распозналось', false); }
    };
    rec.start(250);
    recStart = Date.now();
    $('act').classList.add('rec');
    setStat('пишу…', true);
    if (navigator.vibrate) navigator.vibrate(20);
  } catch (e) {
    setStat('микрофон: ' + (e.name || ''), false);
  } finally {
    recStarting = false;
  }
}
window.addEventListener('pagehide', () => {
  if (rec && rec.state === 'recording') { try { rec.stop(); } catch (_) {} }
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
if (window.Notification && Notification.permission === 'default') {
  setTimeout(() => Notification.requestPermission().catch(() => {}), 4000);
}
/* ---------- файлы с компьютера на телефон (очередь от трея) ---------- */
let toastTimer = 0;
function toast(text, ms) {
  const el = $('toast');
  if (!el) return;
  $('toasttxt').textContent = text;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), ms || 3200);
}

async function pollShare() {
  if (!token || !window.AssiNative || !AssiNative.download) return;
  try {
    const r = await api('/api/share');
    for (const it of r.items || []) {
      const abs = location.origin + '/api/share/' + it.id + '?t=' + encodeURIComponent(token);
      try { AssiNative.download(abs, it.name); } catch (_) {}
      toast('Файл доставлен: ' + it.name + (it.size_text ? ' · ' + it.size_text : ''));
      setTimeout(() => api('/api/share/' + it.id + '/ack', { method: 'POST' }).catch(() => {}), 4000);
      logc('share -> ' + it.name);
    }
  } catch (_) {}
}
if (token && window.AssiNative && AssiNative.download) {
  setTimeout(pollShare, 3000);
  setInterval(pollShare, 15000);
}

/* гостевой режим: у чужих экземпляров нет доступа к компьютеру — прячем эти кнопки */
async function checkOwner() {
  try {
    const r = await fetch('/api/ping').then(r => r.json());
    if (!r.owner) {
      document.body.classList.add('guest');
      logc('guest mode: instance=' + r.instance);
    }
  } catch (_) {}
}

if (token) { refresh(); openStream(); loadSessions(); checkOwner(); }
setInterval(() => { if (token) refresh(); }, 2000);
setInterval(() => { if (token && !document.hidden) loadSessions(); }, 15000);
setInterval(() => {
  if (!token || !streaming) { lastEvt = Date.now(); return; }
  if (Date.now() - lastEvt > 25000) { lastEvt = Date.now(); closeStream(); openStream(); refresh(); }
}, 5000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) closeStream();
  else if (token) { openStream(); refresh(); }
});

/* Связь вернулась по мнению системы — сразу пробуем заново */
window.addEventListener('online', () => { if (token) { _netState = true; refresh(); openStream(); } });

/* Тап по статусу — ручное переподключение: переоткрываем поток и, если совсем всё, перезагружаем страницу */
$('stat').style.cursor = 'pointer';
$('stat').onclick = async () => {
  if (!token) return;
  setStat('переподключаюсь…', true);
  closeStream();
  try {
    await api('/api/history');
    openStream();
    setStat('ждёт', false);
  } catch (e) {
    setStat('перезагружаю страницу…', true);
    setTimeout(() => location.reload(), 400);
  }
};
</script>
